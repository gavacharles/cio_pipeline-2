# Kenya: quarterly contracts on the KNBS Construction Input Price Index.
# KNBS publishes quarterly PDFs (base Dec 2019 = 100), prices referenced to the 15th of
# the quarter's middle month; src/ingest/pull_knbs_cipi.py + parse_knbs_cipi.py read them.
# Four 2021-22 releases are scanned images; later releases' six-quarter tables cover them,
# except Q4-2021. No revisions across 16 text releases (2,228 repeated points).
country: Kenya
iso3: KEN
status: pilot
currency: KES
fx_code: kes
regulation:
  mode: play_money
  regulators:
    - "Capital Markets Authority (CMA) Kenya: regulatory sandbox for index-linked contracts"
    - "Betting Control and Licensing Board: real-money event bets may be betting"
  note: Points have no cash value. Real money needs a legal opinion and CMA sandbox entry first.

settlement:
  statistics_office: Kenya National Bureau of Statistics (KNBS)
  publication: Construction Input Price Indices, quarterly PDF
  url: https://www.knbs.or.ke/button/construction-input-pi/
  parser: knbs_cipi_quarterly
  raw_dirs: [data/raw/knbs]
  frequency: quarterly
  history: combine_releases          # one base (Dec 2019), no revisions: stitch releases
  quantity: qoq_pct_change
  decimals: 2
  trading_closes: mid_quarter_15th   # before KNBS's price reference date
  void_after_days: 180
  excluded_participants:
    - KNBS staff involved in CIPI price collection or compilation

exchange:
  starting_points: 1000
  liquidity_b: 100
  probability_floor: 0.02
  nowcast_min_train: 12              # quarters

# Labels are '<sheet>|<KNBS row label>'; 'all' = the aggregated construction table.
markets:
  - { code: KE_CIPI,   label: "all|total",                       title: Overall construction input prices, cuts: [-0.5, 0.0, 0.5, 1.5] }
  - { code: KE_BUILD,  label: "buildings|total",                 title: Building cost index,               cuts: [-0.5, 0.0, 0.5, 1.5] }
  - { code: KE_CIVIL,  label: "civil|total",                     title: Civil engineering cost index,      cuts: [-0.5, 0.0, 0.5, 1.5] }
  - { code: KE_CEM,    label: "all|cement",                      title: Cement,                            cuts: [-2.0, 0.0, 0.01, 2.0] }
  - { code: KE_STEEL,  label: "all|steel and reinforced bars",   title: Steel and reinforcement bars,      cuts: [-2.0, 0.0, 0.01, 2.0] }
  - { code: KE_FUEL,   label: "all|fuel and lubricants",         title: Fuel and lubricants,               cuts: [-2.0, 0.0, 0.01, 2.0] }
  - { code: KE_LABOUR, label: "all|labour",                      title: Construction labour,               cuts: [-0.5, 0.0, 0.01, 1.0] }

price_items:
  - { code: cement_50kg,  name: "Cement, 50 kg bag",              unit: bag }
  - { code: rebar_y12,    name: "Rebar Y12, 12 m bar",             unit: bar }
  - { code: iron_sheet,   name: "Iron sheet, gauge 30, 3 m",       unit: sheet }
  - { code: diesel,       name: "Diesel, pump price",              unit: litre }
  - { code: ballast,      name: "Ballast, per tonne",              unit: tonne }
  - { code: sand,         name: "River sand, per tonne",           unit: tonne }
  - { code: block_6in,    name: "Machine-cut stone / block, 6 in", unit: piece }
  - { code: mason_day,    name: "Mason, daily wage",               unit: day }
