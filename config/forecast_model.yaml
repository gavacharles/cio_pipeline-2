# Structural CIPI forecaster (src/forecast/). See docs/FORECAST_MODEL.md.
#
# Each index component's monthly % change is explained by its own lag and by the
# macro drivers of its group, then the components are re-aggregated with UBOS's
# published weights. Groups are matched on the UBOS component label (first match wins).

macro_source: data/processed/panel_v1.0_extended.csv
extra_sources:                # joined by month; see each driver below
  - data/raw/rainfall_era5_monthly.csv               # src/ingest/build_rainfall_block.py
  - data/processed/government_funding_panel.csv      # MoFPED fiscal operations

# Drivers, built from the macro panel as monthly 100*log changes unless noted.
drivers:
  fx:    { columns: [exchange_rate],                  transform: dlog }   # UGX per USD (up = shilling weaker)
  oil:   { columns: [brent_crude_usd, exchange_rate], transform: dlog }   # Brent in shillings
  ore:   { columns: [iron_ore_usd, exchange_rate],    transform: dlog }   # iron ore in shillings
  cpi:   { columns: [cpi],                            transform: dlog }   # domestic inflation
  gscpi: { columns: [gscpi_supply_chain_pressure],    transform: level }  # global supply-chain pressure (z-score)
  rain:  { columns: [rain_anomaly],                   transform: level }  # 5-town ERA5 rainfall, standardised by month
  fiscal: { columns: [overall_public_expenditure],    transform: yoy3, publication_lag: 2 }  # public spending growth
# Non-dlog drivers enter with lags 1-3 only. Rainfall and fiscal were each kept because the
# walk-forward backtest improved (both: -1.2% mean RMSE, better in 27 of 36 target x horizon cases).

groups:
  fuel:        { match: [diesel, bitumen],                                  drivers: [oil, fx] }
  steel:       { match: [steel, iron, nails, "doors, windows"],             drivers: [ore, fx, gscpi, fiscal] }
  binders:     { match: [cement, lime],                                     drivers: [fx, oil, cpi, fiscal] }
  quarry:      { match: [aggregate, sand, clay, murram, "concrete bricks"], drivers: [oil, cpi, rain, fiscal] }
  imported:    { match: [tiles, paints, plastic, cables],                   drivers: [fx, oil, gscpi] }
  wood:        { match: [timber, eucalyptus],                               drivers: [cpi] }
  unpublished: { match: [unpublished],                                      drivers: [fx, oil, cpi] }
  domestic:    { match: [labour, services, utilities],                      drivers: [cpi] }

model:
  lag_structure: [0, "1-3"]   # each driver enters at lag 0 and as the mean of lags 1-3 (gscpi: lags 1-3 only)
  huber_epsilon: 1.5          # robust loss: big 2022-style months are down-weighted, not ignored
  ridge_alpha: 1.0            # L2 shrinkage on standardised drivers (stability with ~100 months)
  own_lag_bounds: [-0.5, 0.8]
  min_train_months: 48
  calendar_months: []         # policy-calendar dummies, e.g. [1, 7]: July = new fiscal year (Finance Act,
                              # excise, tariffs), January = wage reviews. Significant in residuals
                              # (utilities July t=5.5, labour January t=3.8) but they worsened
                              # out-of-sample RMSE when applied to every component, so off by default.

macro_simulation:
  var_ridge: 5.0              # VAR(1) on drivers, shrunk toward "no persistence"
  block_months: 6             # joint block bootstrap of macro + component residuals (keeps co-movement);
                              # 6 beat 3 and 12 on backtest accuracy and coverage
  drift_uncertainty: true     # each path also redraws the components' trend (bootstrap mean)
  n_paths: 2000
  seed: 2026

# Known tax measures (config/policy_events.yaml) enter the forecast as one-off shocks of
# pct x pass_through. History is mixed (diesel Jul-2021 +6.7%, Jul-2024 -1.4%), so the
# baseline assumes half; scenarios below bracket it.
policy:
  file: config/policy_events.yaml
  baseline_pass_through: 0.5

# Scenario shocks are added to the baseline macro paths (cumulative log-% over the window).
scenarios:
  baseline: {}
  policy_full_pass_through: { pass_through: 1.0 }
  policy_no_pass_through:   { pass_through: 0.0 }
  oil_reverses:        { oil: { total: -35, months: [1, 6] } }     # Brent back from ~$103 to ~$70 by Oct-2026
  oil_spike:           { oil: { total: 30,  months: [1, 3] } }
  shilling_weakens_10: { fx:  { total: 10,  months: [1, 6] } }
  supply_chain_stress: { gscpi: { level: 2.0, months: [1, 6] } }
  replay_2022:         { replay: ["2022-03-01", "2023-02-01"] }    # 2022 macro changes, month by month
